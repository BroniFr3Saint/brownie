<script>
/* ============================
   A VESSEL OF HORROR - BRANCHING GAME
   Five chapters, multiple endings
   ============================ */

// ===== HIDDEN STORY VARIABLES =====
const V = {
  evidence: 0,        // 0-3: useful evidence collected
  trust: 0,           // 0-3: group trust in Missy
  unity: 0,           // 0-3: group unity
  selena_confidence: 0, // 0-2
  lucy_confidence: 0,   // 0-2
  rhoda_caution: 0,     // 0-2
  sophia_courage: 0,    // 0-2
  esther_clues: 0,      // 0-3: Esther's identity and clues
  danger: 0,            // 0-3: how threatened
  clues_found: 0,       // 0-5: notable clues
  chapter: 0,
  step: 0,
  skip: false,
  fast: false,
};

// ===== STORY DATA =====
const N = {};

function renderScene(node) {
  const s = document.getElementById('s');
  s.innerHTML = '';
  if (node.ch) {
    const h = document.createElement('h1');
    h.textContent = node.title || '';
    s.appendChild(h);
  }
  const t = document.createElement('p');
  t.textContent = node.text || '';
  s.appendChild(t);
  if (node.dread) {
    const d = document.createElement('p');
    d.className = 'dread';
    d.textContent = node.dread;
    s.appendChild(d);
  }
  if (node.short) {
    const sh = document.createElement('p');
    sh.className = 'short';
    sh.textContent = node.short;
    s.appendChild(sh);
  }
  if (node.choices) {
    node.choices.forEach(ch => {
      const b = document.createElement('button');
      b.textContent = ch.lbl;
      b.addEventListener('click', () => {
        handleChoice(ch.id);
      });
      s.appendChild(b);
    });
  }
}

function handleChoice(choiceId) {
  const node = N.current;
  const ch = node.choices.find(c => c.id === choiceId);
  if (!ch) return;

  // Apply consequences
  if (ch.v) {
    for (let key in ch.v) {
      V[key] = (V[key] || 0) + (ch.v[key] || 0);
    }
    for (let k of ['evidence','trust','unity','selena_confidence','lucy_confidence','rhoda_caution','sophia_courage','esther_clues','danger','clues_found']) {
      V[k] = Math.max(0, Math.min(3, V[k]));
    }
  }

  // Determine next node
  let next = null;
  if (ch.to) {
    next = N[ch.to];
  } else {
    const chapterOrder = [
      'c1s1','c1s2','c1s3','c2s1','c2s2','c2s3',
      'c3s1','c3s2','c3s3','c4s1','c4s2','c4s3',
      'c5s1','c5s2'
    ];
    const idx = chapterOrder.indexOf(node.title);
    if (idx < chapterOrder.length - 1) {
      next = N[chapterOrder[idx + 1]];
    } else {
      N.current = null;
      evaluateEnding();
      return;
    }
  }

  N.current = next;
  renderScene(N.current);
}

// ===== ENDING EVALUATION =====
function evaluateEnding() {
  const s = document.getElementById('s');
  s.innerHTML = '';
  let end = null, epi = '', message = '';

  const best = V.evidence >= 2 && V.trust >= 2 && V.unity >= 2 && V.esther_clues >= 2;
  const escape_ = V.evidence < 2 && V.chapter >= 5;
  const difficult = V.trust < 2 && V.evidence < 2 && V.unity < 2;
  const secret = V.esther_clues >= 3 && V.clues_found >= 4;

  if (best) {
    end = "THE VESSEL THAT WOULD NOT BREAK";
    epi = "The evidence reaches the authorities. The driver and Mr. Daniel are taken in for questioning, and the ladies are safely escorted away.";
    message = "The group preserved important evidence, trusted one another, and made careful decisions.";
  } else if (escape_) {
    end = "THE ONES WHO MADE IT OUT";
    epi = "The ladies escape through the hidden passage and reach the main road. They are safe, but much of the evidence remains behind.";
    message = "When Missy prioritised escape over collecting evidence, the mystery remains partly unsolved.";
  } else if (difficult) {
    end = "THE PRICE OF DISTRUST";
    epi = "The group gets out, but poor communication and suspicion have caused unnecessary trouble.";
    message = "When Missy repeatedly dismissed warnings and made decisions without considering the others, the group paid the price.";
  } else if (secret) {
    end = "THE NINTH NAME";
    epi = "The organisation behind the excursion had a much longer history. Green Valley was only one of several locations used to collect information about visitors.";
    message = "By discovering every clue, Missy unlocked the hidden ending.";
  } else {
    end = "TRACEBACK";
    epi = "The story ends before all mysteries are resolved.";
    message = "A vessel of horror, and the journey continues...";
  }

  const h = document.createElement('h2');
  h.textContent = end;
  s.appendChild(h);
  const em = document.createElement('em');
  em.textContent = epi;
  s.appendChild(em);
  const note = document.createElement('p');
  note.style.textAlign = 'center';
  note.style.color = '#7d776d';
  note.style.fontSize = '.85em';
  note.textContent = message;
  s.appendChild(note);
  const btn2 = document.createElement('button');
  btn2.textContent = "Start a New Game";
  btn2.style.marginTop = '30px';
  btn2.addEventListener('click', () => { location.reload(); });
  s.appendChild(btn2);
}

// ===== ENDING EVALUATION =====
function evaluateEnding() {
  const s = document.getElementById('s');
  s.innerHTML = '';
  let end = null, epi = '', message = '';

  const best = V.evidence >= 2 && V.trust >= 2 && V.unity >= 2 && V.esther_clues >= 2;
  const escape_ = V.evidence < 2 && V.chapter >= 5;
  const difficult = V.trust < 2 && V.evidence < 2 && V.unity < 2;
  const secret = V.esther_clues >= 3 && V.clues_found >= 4;

  if (best) {
    end = "THE VESSEL THAT WOULD NOT BREAK";
    epi = "The evidence reaches the authorities. The driver and Mr. Daniel are taken in for questioning, and the ladies are safely escorted away.";
    message = "The group preserved important evidence, trusted one another, and made careful decisions.";
  } else if (escape_) {
    end = "THE ONES WHO MADE IT OUT";
    epi = "The ladies escape through the hidden passage and reach the main road. They are safe, but much of the evidence remains behind.";
    message = "When Missy prioritised escape over collecting evidence, the mystery remains partly unsolved.";
  } else if (difficult) {
    end = "THE PRICE OF DISTRUST";
    epi = "The group gets out, but poor communication and suspicion have caused unnecessary trouble.";
    message = "When Missy repeatedly dismissed warnings and made decisions without considering the others, the group paid the price.";
  } else if (secret) {
    end = "THE NINTH NAME";
    epi = "The organisation behind the excursion had a much longer history. Green Valley was only one of several locations used to collect information about visitors.";
    message = "By discovering every clue, Missy unlocked the hidden ending.";
  } else {
    end = "TRACEBACK";
    epi = "The story ends before all mysteries are resolved.";
    message = "A vessel of horror, and the journey continues...";
  }

  const h = document.createElement('h2');
  h.textContent = end;
  s.appendChild(h);
  const em = document.createElement('em');
  em.textContent = epi;
  s.appendChild(em);
  const note = document.createElement('p');
  note.style.textAlign = 'center';
  note.style.color = '#7d776d';
  note.style.fontSize = '.85em';
  note.textContent = message;
  s.appendChild(note);
  const btn2 = document.createElement('button');
  btn2.textContent = "Start a New Game";
  btn2.style.marginTop = '30px';
  btn2.addEventListener('click', () => { location.reload(); });
  s.appendChild(btn2);
}
